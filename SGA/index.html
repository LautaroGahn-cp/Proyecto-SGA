<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/estilos.css">
    <script src="JS/alumnos.js" defer></script>
    <title>SGA</title>
</head>
<body>
    <header>
    <h1>Sistema de Gestion Academica</h1>
    </header>
    <main>
        <p>Proyecto de Programacion</p>
        <section>
            <form id="formAlumno">
                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre"><br><br>

            <label for="carrera">Carrera: </label>
                <input type="text" id="carrera"><br><br>

                <label for="Correo">Correo Elecftronico: </label>
                <input type="email" id="correo"><br><br>

                <button type="submit">Guardar Alumno</button>
            </form>
            <p id="mensaje"></p>
        </section>
        <section> 
            <h2>Alumnos Registrados</h2>
            <p id="cantidadAlumnos"></p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Carrera</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaAlumnos"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
