<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="../JS/storage.js" defer></script>
    <script src="../JS/ui.js"></script>
    <script src="../JS/alumnos.js" defer></script>
    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html" class="activo">Alumnos</a>
            <a href="docentes.html">Docentes</a>    
        </nav>
    </header>
    <main>
        <p>Proyecto de Programacion</p>
        <section class="formulario-container">
            <h2>Alta de alumno</h2>
            <form id="formulario">
                <div class="campo">
                    <label for="nombre">Nombre: </label>
                    <input type="text" id="nombre"><br><br> 
                </div>
                <div class="campo">
                    <label for="carrera">Carrera: </label>
                    <input type="text" id="carrera"><br><br>
                </div>
                <div class="campo">
                    <label for="Correo">Correo Elecftronico: </label>
                    <input type="texto" id="correo"><br><br>
                </div>
                <div class="acciones-form">
                    <button type="submit" id="btnGuardar">Guardar Alumno</button>
                    <button type="button" id="btnCancelar" class="btn-cancelar">Cancelar</button>
                </div>
            </form>
        </section>
        <section class="lista-container"> 
            <h2>Alumnos Registrados</h2>
            <p id="cantidadAlumnos"></p>
            <table>
                <thead>
                    <tr>
                        <th>Legajo</th>
                        <th>Nombre</th>
                        <th>Carrera</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaAlumnos"></tbody>
            </table>
        </section>
        <div id="mensaje" class="mesj"></div>
    </main>  
</body>
</html>
